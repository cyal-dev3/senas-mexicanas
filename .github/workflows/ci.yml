name: Pruebas

on:
  push:
    branches: [main, mejoras]
  pull_request:

jobs:
  python:
    name: Python (miratek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Las pruebas no abren la camara ni la interfaz: con NumPy y pytest basta.
      - run: pip install numpy pytest
      - run: python -m pytest -q

  android:
    name: Android (core, app y entrenador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # El runner ya trae el SDK de Android; solo hay que aceptar las licencias para que
      # Gradle descargue lo que falte (platform 35, build-tools 35.0.0).
      - name: Licencias del SDK de Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias y de paridad
        working-directory: android
        run: chmod +x gradlew && ./gradlew :core:testDebugUnitTest :app:testDebugUnitTest :trainer:testDebugUnitTest --console=plain
      - name: Compilar las dos APK (debug)
        working-directory: android
        run: ./gradlew :app:assembleDebug :trainer:assembleDebug --console=plain
